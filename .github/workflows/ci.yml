name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Structure, metadata, internal links, and the guarantee that the site
      # makes no third-party requests. Standard library only, so no install step.
      - name: Check the site
        run: python scripts/check_site.py .

      - name: Check the sitemap is well-formed
        run: python -c "import xml.dom.minidom, sys; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml parses')"

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [site]
    steps:
      # One aggregate check to require in branch protection. There is one job
      # today, and this is what keeps that from mattering: a second job added
      # later is covered without touching the protection rule.
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All checks passed."
